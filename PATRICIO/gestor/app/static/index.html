<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor de Inventario</title>
<style>
:root{--bg:#e8ece8;--ink:#14201b;--mut:#5b6761;--card:#fff;--acc:#2f3fd0;--line:#d3d9d4}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,.brand{font-family:Georgia,'Times New Roman',serif;font-weight:700;margin:0}
button,input{font:inherit}a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:.6em 1.1em;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
input{width:100%;padding:.6em .8em;border:1px solid var(--line);border-radius:8px;background:#fff}
label{display:block;margin:.8em 0 .2em;font-weight:600}
.err{color:#b3261e;min-height:1.4em}
#login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
#login .hero{background:var(--ink);color:#fff;padding:12vh 8%;display:flex;flex-direction:column;justify-content:center;gap:1.5rem}
#login h1{font-size:clamp(2rem,4vw,3.2rem);line-height:1.1}
.bands{display:flex;height:70px;border-radius:10px;overflow:hidden}.bands i{display:block}
#login form{padding:12vh 12%;align-self:center}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:#dfe4df;padding:1.2rem;display:flex;flex-direction:column;gap:.3rem;position:sticky;top:0;height:100vh}
nav .brand{margin-bottom:1rem;font-size:1.2rem}
nav a{padding:.6em .8em;border-radius:8px;text-decoration:none;cursor:pointer}
nav a.on{background:var(--acc);color:#fff}nav .out{margin-top:auto}
main{padding:1.5rem 2rem;max-width:1100px;width:100%}
h2{font-size:1.8rem;margin-bottom:1rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border-radius:12px;padding:1rem;border:1px solid var(--line)}
.stat b{display:block;font:700 2.2rem Georgia,serif}
.thumb{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:#eee;display:block}
.pal{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:.5rem 0}
.tag{font-size:.8rem;padding:.1em .6em;border-radius:99px;border:1px solid var(--line)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.3em 1em;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.drop{border:2px dashed var(--mut);border-radius:12px;padding:2rem;text-align:center;cursor:pointer;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.donut{width:150px;aspect-ratio:1;border-radius:50%;margin:auto;-webkit-mask:radial-gradient(circle 46px,#0000 98%,#000);mask:radial-gradient(circle 46px,#0000 98%,#000)}
.sw{display:inline-block;width:34px;height:34px;border-radius:8px;margin-right:.3rem}
.sel{outline:3px solid #c9a227}.mini{width:64px;cursor:pointer;border-radius:6px}
@media(max-width:800px){#login,.two{grid-template-columns:1fr}#login .hero{padding:2rem}
#app{grid-template-columns:1fr}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;z-index:9;padding:.5rem}
nav .brand{display:none}nav .out{margin:0}main{padding:1rem 1rem 5rem}}
@media(prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}}
</style></head><body>
<section id="login"><div class="hero"><h1>Gestiona mejor.<br>Combina con inteligencia.</h1>
<div class="bands"><i style="flex:5;background:#1f3a5f"></i><i style="flex:3;background:#d9b99b"></i><i style="flex:2;background:#8c2f39"></i></div>
<p>Sube la foto de una prenda y el sistema detecta sus colores y qué otras prendas combinan con ella.</p></div>
<form id="lf"><label for="em">Usuario</label><input id="em" type="email" value="admin@atelier.es" required>
<label for="pw">Contraseña</label><input id="pw" type="password" value="admin123" required>
<p class="err" id="le"></p><button class="btn">Iniciar sesión</button>
<p><a href="#" onclick="alert('Pide a la administradora que restablezca tu contraseña.');return false">¿Olvidaste tu contraseña?</a></p></form></section>
<div id="app" hidden><nav id="nav"></nav><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,o={})=>{o.headers={...(o.headers||{}),Authorization:'Bearer '+(localStorage.t||'')};
 const r=await fetch('/api'+p,o);if(r.status==401){localStorage.removeItem('t');show();throw Error('Sesión expirada')}
 const j=await r.json();if(!r.ok)throw Error(j.detail||'Error');return j};
const pal=g=>`<div class="pal">${g.palette.map(c=>`<i style="flex:${c.pct};background:${c.hex}" title="${c.hex} · ${c.pct}%"></i>`).join('')}</div>`;
const FAM={'Cálido':'Cálido','Frío':'Frío','Neutro':'Neutro'};
const pages={dashboard:'Dashboard',catalogo:'Catálogo',subir:'Subir prenda',reco:'Recomendaciones'};
function show(){const on=!!localStorage.t;$('#login').hidden=on;$('#app').hidden=!on;if(on)route()}
$('#lf').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});
 const j=await r.json();if(!r.ok)throw Error(j.detail);localStorage.t=j.token;$('#le').textContent='';show()}catch(x){$('#le').textContent=x.message}};
async function logout(){await api('/auth/logout',{method:'POST'}).catch(()=>{});localStorage.removeItem('t');show()}
function route(){const p=(location.hash.slice(1)||'dashboard').split('/');const k=pages[p[0]]?p[0]:'dashboard';
 $('#nav').innerHTML='<span class="brand">Gestor de Inventario</span>'+Object.entries(pages).map(([h,n])=>`<a href="#${h}" class="${h==k?'on':''}">${n}</a>`).join('')+'<a class="out" onclick="logout()">Cerrar sesión</a>';
 ({dashboard,catalogo,subir,reco})[k](p[1]).catch(e=>$('#main').innerHTML=`<p class="err">${esc(e.message)}</p>`)}
addEventListener('hashchange',route);
async function dashboard(){const d=await api('/dashboard'),f=d.families,t=Math.max(1,d.total);
 const a=f['Cálido']/t*100,b=a+f['Frío']/t*100,C=['#d9622b','#2f7fd0','#9aa39e'];
 $('#main').innerHTML=`<h2>Dashboard</h2><div class="grid">${[['Total de prendas',d.total],['Colores identificados',d.colors],['Combinaciones creadas',d.combos]].map(([l,v])=>`<div class="card stat">${l}<b>${v}</b></div>`).join('')}</div><br>
 <div class="two"><div class="card"><h3>Familias de color</h3><div class="donut" style="background:conic-gradient(${C[0]} 0 ${a}%,${C[1]} 0 ${b}%,${C[2]} 0)"></div>
 <p>${Object.keys(f).map((k,i)=>`<span class="sw" style="width:12px;height:12px;background:${C[i]}"></span>${k}: ${f[k]} `).join('')}</p></div>
 <div class="card"><h3>Colores dominantes</h3>${d.dominant.map(h=>`<span class="sw" style="background:${h}" title="${h}"></span>`).join('')||'<p>Aún no hay prendas.</p>'}<p><a href="#catalogo">Ver catálogo</a></p></div></div><br>
 <div class="card"><div class="row"><h3 style="margin:0">Últimas prendas añadidas</h3><a href="#catalogo">Ver todas</a></div><div class="grid">${d.latest.map(g=>`<div><img class="thumb" src="${g.image}" alt="${esc(g.name)}"><b>${esc(g.name)}</b></div>`).join('')||'<p>Sube tu primera prenda en “Subir prenda”.</p>'}</div></div>`}
let fam='Todos',q='';
async function catalogo(){const l=await api(`/garments?q=${encodeURIComponent(q)}&fam=${encodeURIComponent(fam)}`);
 $('#main').innerHTML=`<h2>Catálogo</h2><div class="row"><input id="q" style="max-width:320px" placeholder="Buscar por nombre o SKU" value="${esc(q)}"><a class="btn" href="#subir">+ Nueva prenda</a></div>
 <div class="row">${['Todos','Cálido','Frío','Neutro'].map(f=>`<button class="chip ${f==fam?'on':''}" onclick="fam='${f}';route()">${f}</button>`).join('')}<span>${l.length} prendas</span></div>
 <div class="grid">${l.map(g=>`<div class="card"><img class="thumb" src="${g.image}" alt="${esc(g.name)}">${pal(g)}<b>${esc(g.name)}</b><br><small>${esc(g.sku)} · <input type="number" min="0" value="${g.stock}" style="width:70px;padding:.1em .3em" onchange="api('/garments/${g.id}',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({stock:+this.value})})"> uds.</small>
 <div class="row" style="margin:.5rem 0 0"><span class="tag">${g.family}</span><a href="#reco/${g.id}">Combinar</a><a href="#" onclick="del(${g.id});return false" style="color:#b3261e">Eliminar</a></div></div>`).join('')||'<p>0 prendas. Cambia la búsqueda o elige «Todos».</p>'}</div>`;
 let t;$('#q').oninput=e=>{q=e.target.value;clearTimeout(t);t=setTimeout(()=>{catalogo().then(()=>{const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)})},300)}}
async function del(id){if(confirm('¿Eliminar esta prenda?')){await api('/garments/'+id,{method:'DELETE'});route()}}
async function subir(){$('#main').innerHTML=`<h2>Subir prenda</h2><div class="two"><div class="card"><div class="drop" id="dz" tabindex="0">Arrastra una imagen aquí<br><small>JPG, PNG hasta 10 MB</small><br><br><button type="button" class="btn ghost">Seleccionar imagen</button></div>
 <input type="file" id="f" accept="image/jpeg,image/png" hidden><p id="fn"></p>
 <label>Nombre</label><input id="n"><label>Código (SKU)</label><input id="s"><label>Existencias</label><input id="st" type="number" min="0" value="1">
 <p class="err" id="e"></p><button class="btn" id="go">Analizar prenda</button></div>
 <div class="card"><h3>Resultado del análisis</h3><div id="res"><p>Sin resultados todavía.</p></div></div></div>`;
 const f=$('#f'),dz=$('#dz');dz.onclick=()=>f.click();dz.ondragover=e=>e.preventDefault();dz.ondrop=e=>{e.preventDefault();f.files=e.dataTransfer.files;f.onchange()};
 f.onchange=()=>$('#fn').textContent=f.files[0]?.name||'';
 $('#go').onclick=async()=>{const x=f.files[0];$('#e').textContent='';
  if(!x||!['image/jpeg','image/png'].includes(x.type)||x.size>10485760)return $('#e').textContent='Elige un archivo JPG o PNG de hasta 10 MB.';
  if(!$('#n').value||!$('#s').value)return $('#e').textContent='Escribe el nombre y el SKU.';
  const fd=new FormData();fd.append('file',x);fd.append('name',$('#n').value);fd.append('sku',$('#s').value);fd.append('stock',$('#st').value);
  $('#go').disabled=true;try{const g=await api('/garments',{method:'POST',body:fd});
   $('#res').innerHTML=`<img class="thumb" style="max-width:200px" src="${g.image}" alt="">${g.palette.map(c=>`<p><span class="sw" style="background:${c.hex}"></span>${c.hex} · ${c.pct}% · H${Math.round(c.h)} S${Math.round(c.s*100)} V${Math.round(c.v*100)}</p>`).join('')}<p><span class="tag">${g.family}</span> Prenda registrada en el catálogo.</p>`}
  catch(e){$('#e').textContent=e.message}$('#go').disabled=false}}
async function reco(id){const all=await api('/garments');if(!all.length){$('#main').innerHTML='<h2>Recomendaciones</h2><p>Sube prendas para ver combinaciones.</p>';return}
 id=+id||all[0].id;const base=all.find(g=>g.id==id)||all[0],refresh=reco.r;reco.r=false;
 const r=await api(`/garments/${base.id}/recommendations?refresh=${!!refresh}`);
 $('#main').innerHTML=`<h2>Recomendaciones</h2><div class="row"><b>Combinaciones inteligentes</b><button class="btn" onclick="reco.r=true;route()">Generar nuevas</button></div>
 <div class="two"><div class="card"><h3>Prenda seleccionada</h3><img class="thumb" style="max-width:240px" src="${base.image}" alt="">${pal(base)}<b>${esc(base.name)}</b>
 <div class="row" style="margin-top:.8rem">${all.map(g=>`<a href="#reco/${g.id}"><img class="mini ${g.id==base.id?'sel':''}" src="${g.image}" alt="${esc(g.name)}"></a>`).join('')}</div></div>
 <div class="card"><h3>Prendas que combinan</h3>${r.map(x=>`<div class="row"><img class="mini" src="${x.garment.image}" alt=""><div><b>${esc(x.garment.name)}</b><br><span class="tag">${x.type}</span> ${x.garment.stock} uds. · <b>${x.affinity}%</b></div></div>`).join('')||'<p>Sin sugerencias. Elige otra prenda base.</p>'}</div></div>`}
show();
</script></body></html>
